                    <thead className="bg-slate-900 text-slate-400 font-semibold border-b border-slate-800">
                      <tr>
                        <th className="p-3">Facility Name</th>
                        <th className="p-3">Occupancy</th>
                        <th className="p-3">Current Wait</th>
                        <th className="p-3">AI Predicted Wait</th>
                        <th className="p-3">ER Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {facilityDataset.map((f) => (
                        <tr key={f.id} className="hover:bg-slate-900/50">
                          <td className="p-3 font-bold text-white">{f.name}</td>
                          <td className="p-3">
                            <span className="font-mono text-cyan-400">{f.capacityPercent}%</span>
                          </td>
                          <td className="p-3 font-mono text-amber-400">{f.currentWaitMins} mins</td>
                          <td className="p-3 font-mono text-teal-400">{f.predictedWaitMins} mins</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              f.emergencyReady ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'
                            }`}>
                              {f.emergencyReady ? '24/7 Active' : 'Standard'}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* ==========================================================================
             BOOKING CONFIRMATION MODAL
             ========================================================================== */}
          {showBookingModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="glass-panel max-w-md w-full rounded-3xl p-6 border border-slate-800 space-y-6">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-lg text-white">Confirm Visit Slot</h3>
                  <button onClick={() => setShowBookingModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-2 text-xs text-slate-300">
                  <p><strong className="text-slate-400">Facility:</strong> {selectedFacility?.name}</p>
                  <p><strong className="text-slate-400">Slot Time:</strong> {selectedSlot}</p>
                  <p><strong className="text-slate-400">Patient:</strong> {activeFamilyMember.name}</p>
                </div>

                <button
                  onClick={() => {
                    const newApt = {
                      id: `APT-${Math.floor(1000 + Math.random() * 9000)}`,
                      facilityName: selectedFacility?.name,
                      doctorName: 'Triage Assigned Specialist',
                      timeSlot: selectedSlot,
                      patientName: activeFamilyMember.name,
                      status: 'Confirmed',
                      qrCodeVal: `CARE-${Math.floor(1000 + Math.random() * 9000)}`
                    };
                    setAppointments([newApt, ...appointments]);
                    setShowBookingModal(false);
                    setActiveTab('appointments');
                  }}
                  className="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-slate-950 font-extrabold text-xs shadow-lg shadow-brand-500/20"
                >
                  Confirm & Generate Digital Pass
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    /* ==========================================================================
       LEAFLET MAP REACT COMPONENT
       ========================================================================== */
    function LeafletMapComponent({ facilities, desertClusters }) {
      const mapRef = useRef(null);
      const leafletInstance = useRef(null);

      useEffect(() => {
        if (!mapRef.current) return;

        // Initialize Leaflet map centered on Bangalore (12.9716, 77.5946)
        if (!leafletInstance.current) {
          const map = L.map(mapRef.current).setView([12.9352, 77.6245], 11);
          
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
          }).addTo(map);

          // Dark overlay tile style
          map.getPane('tilePane').classList.add('dark-tiles');

          leafletInstance.current = map;
        }

        const map = leafletInstance.current;

        // Add facility pins
        facilities.forEach((fac) => {
          const marker = L.circleMarker([fac.lat, fac.lng], {
            radius: 9,
            fillColor: fac.emergencyReady ? '#ef4444' : '#14b8a6',
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.9
          }).addTo(map);

          marker.bindPopup(`
            <div style="color: #0f172a; font-family: sans-serif; padding: 4px;">
              <strong style="font-size: 13px;">${fac.name}</strong><br/>
              <span style="font-size: 11px; color: #475569;">${fac.category}</span><br/>
              <span style="font-size: 11px; color: #0d9488; font-weight: bold;">Est. Wait: ${fac.predictedWaitMins} mins</span>
            </div>
          `);
        });

        // Add desert cluster highlight circles
        desertClusters.forEach((cluster) => {
          L.circle([cluster.lat, cluster.lng], {
            color: cluster.color,
            fillColor: cluster.color,
            fillOpacity: 0.2,
            radius: 3000
          }).addTo(map).bindPopup(`
            <div style="color: #0f172a; font-family: sans-serif;">
              <strong style="color: #b91c1c;">${cluster.name}</strong><br/>
              <span style="font-size: 11px;">Access Score: <strong>${cluster.accessScore}/100</strong> (${cluster.priority})</span><br/>
              <p style="font-size: 10px; color: #334155; margin-top: 4px;">${cluster.primaryDeficit}</p>
            </div>
          `);
        });

      }, [facilities, desertClusters]);

      return <div ref={mapRef} className="w-full h-full min-h-[500px] z-10"></div>;
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
